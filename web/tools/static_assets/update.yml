# 雲端更新（GitHub Actions）：下載資料庫 → 跑 pipeline → 匯出靜態站 → （可選）部署 GitHub Pages。
# 此檔放在 main 分支（排程只讀預設分支）；程式碼在 `src` 分支（checkout ref: src）。
# 由 web/tools/export_static.py 隨靜態匯出一起放入 main，deploy_pages.sh 不會把它洗掉。
# 資料庫：Release 資產 db-latest（gzip），上一份 db-prev。
name: 雲端更新
on:
  workflow_dispatch:
    inputs:
      job:
        description: "pipeline 工作：daily（盤後主更新）或 evening（晚間補抓）"
        type: choice
        options: [daily, evening]
        default: daily
      deploy:
        description: "成功後是否部署到 GitHub Pages（試跑請選 false）"
        type: boolean
        default: false
      save_db:
        description: "成功後是否把資料庫寫回 Release db-latest"
        type: boolean
        default: true
      fetch_isin:
        description: "是否抓 isin.twse.com.tw 證券清單（雲端很慢，約 12 分鐘以上；預設略過）"
        type: boolean
        default: false
      code_ref:
        description: "程式碼分支"
        type: string
        default: src
  # 【排程預設停用】切換正式前才取消註解（台北 18:00 週一至五、22:00 每日）：
  # schedule:
  #   - cron: "0 10 * * 1-5"   # 18:00 台北，週一至五 → daily
  #   - cron: "0 14 * * *"     # 22:00 台北，每日 → evening
permissions:
  contents: write   # 更新 Release（db-latest/db-prev）
  actions: write    # 結尾重新啟用本 workflow（避免 60 天無活動被停用排程）
concurrency:
  group: update-site
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Taipei
      PIPELINE_SKIP_ISIN: ${{ inputs.fetch_isin && '0' || '1' }}
      TWSITE_CLOUD_JOB: ${{ inputs.job || (github.event.schedule == '0 10 * * 1-5' && 'daily' || 'evening') }}
    outputs:
      ok: ${{ steps.final.outputs.ok }}
      data_date: ${{ steps.final.outputs.data_date }}
    steps:
      - name: 取得程式碼（src 分支）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || 'src' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/cloud/requirements-cloud.txt
      - name: 安裝套件
        timeout-minutes: 10
        run: pip install -r tools/cloud/requirements-cloud.txt
      - name: 下載資料庫（db-latest）
        timeout-minutes: 10
        run: bash tools/cloud/db_fetch.sh
      - name: 執行 pipeline（最多 3 次）
        id: pipe
        timeout-minutes: 185
        run: bash tools/cloud/run_pipeline.sh "$TWSITE_CLOUD_JOB"
      - name: 匯出靜態站＋自檢＋範圍關卡
        id: build
        if: steps.pipe.outcome == 'success'
        timeout-minutes: 25
        run: bash tools/cloud/build_site.sh build/site
      - name: 資料庫寫回 db-latest（舊的放 db-prev）
        id: save
        if: steps.pipe.outcome == 'success' && (github.event_name == 'schedule' || inputs.save_db)
        timeout-minutes: 15
        run: bash tools/cloud/db_publish.sh
      - name: 打包匯出（Pages artifact）
        if: steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
          retention-days: 7
      - name: 上傳日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            logs/*.log
            logs/quality_*.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: 結果
        id: final
        if: always()
        run: |
          ok=false
          if [ "${{ steps.pipe.outcome }}" = success ] && [ "${{ steps.build.outcome }}" = success ]; then ok=true; fi
          dd=$(python -c "import json;print(json.load(open('build/site/build-info.json'))['data_date'])" 2>/dev/null || echo "")
          echo "ok=$ok" >> "$GITHUB_OUTPUT"; echo "data_date=$dd" >> "$GITHUB_OUTPUT"
          {
            echo "### 雲端更新 job=$TWSITE_CLOUD_JOB"
            echo "- pipeline：${{ steps.pipe.outcome }}（嘗試 ${{ steps.pipe.outputs.attempts }} 次，job_runs.status=${{ steps.pipe.outputs.status }}）"
            echo "- 匯出＋範圍關卡：${{ steps.build.outcome }}；資料庫寫回：${{ steps.save.outcome }}"
            echo "- 資料日期：${dd:-無}；可部署：$ok；部署請求：${{ github.event_name == 'schedule' && 'true（排程）' || inputs.deploy }}"
            [ -d build/site ] && echo "- 匯出大小：$(du -sh build/site | cut -f1)，檔案 $(find build/site -type f | wc -l) 個"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = true ]
      - name: 保持排程啟用
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true

  deploy:
    needs: update
    # 只有 pipeline、匯出、範圍關卡全部成功，且（排程 或 手動 deploy=true）才部署
    if: needs.update.outputs.ok == 'true' && (github.event_name == 'schedule' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
