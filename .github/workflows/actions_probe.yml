# ──────────────────────────────────────────────────────────────────────────
# 【草稿｜尚未推送｜尚未執行】actions_probe.yml
# 目的：只做「連線測試」，量測 GitHub Actions 執行環境（國外 IP）能否連到
#       TWSE／TPEx／MOPS／FinMind。不讀寫資料庫、不跑 pipeline、不使用任何秘密。
# 觸發：僅 workflow_dispatch（手動）。無 schedule、無 push/pull_request。
# 權限：contents: read（最小）。未使用 GITHUB_TOKEN 以外之任何 secrets，
#       也未印出任何秘密；FinMind 為「不帶 token」的免費存取。
# 推送位置（待使用者同意後由負責人處理）：.github/workflows/actions_probe.yml
# 不碰 pages.yml。
# 輸出：job log 的純文字表 + artifact「actions-probe-result」
#       （probe_table.txt、probe.json），負責人貼到 logs/finmind/actions_probe_result.txt。
# 端點全部取自 docs/sources.md 已於本機實測的 URL；每個端點只請求 1 次，間隔 2 秒。
# ──────────────────────────────────────────────────────────────────────────
name: actions-probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 記錄執行環境（不含秘密）
        run: |
          echo "start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_taipei=$(TZ=Asia/Taipei date +%Y-%m-%dT%H:%M:%S%z)"
          uname -a
          curl --version | head -1
          python3 --version

      - name: 連線測試（每端點 1 次）
        shell: bash
        run: |
          set -u
          mkdir -p out body
          # 欄位以 | 分隔：名稱|方法|類型(json/html)|內容關鍵字(html 用，可空)|URL|POST 資料(可空)
          cat > endpoints.txt <<'SPEC'
          twse_MI_INDEX|GET|json||https://www.twse.com.tw/exchangeReport/MI_INDEX?response=json&date=20261109&type=ALLBUT0999|
          twse_STOCK_DAY_2330|GET|json||https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=20261101&stockNo=2330|
          twse_TWT49U|GET|json||https://www.twse.com.tw/rwd/zh/exRight/TWT49U?response=json&startDate=20261101&endDate=20261110&stockNo=|
          twse_TWTAUU|GET|json||https://www.twse.com.tw/exchangeReport/TWTAUU?response=json&startDate=20250101&endDate=20261110|
          twse_TWTAWU|GET|json||https://www.twse.com.tw/exchangeReport/TWTAWU?response=json&startDate=&endDate=|
          twse_holidaySchedule_rwd|GET|json||https://www.twse.com.tw/rwd/zh/holidaySchedule/holidaySchedule?response=json&queryYear=2026|
          twse_isin_strMode2|GET|html|有價證券代號|https://isin.twse.com.tw/isin/C_public.jsp?strMode=2|
          twse_openapi_t187ap03_L|GET|json||https://openapi.twse.com.tw/v1/opendata/t187ap03_L|
          twse_openapi_t187ap04_L|GET|json||https://openapi.twse.com.tw/v1/opendata/t187ap04_L|
          twse_openapi_t187ap05_L|GET|json||https://openapi.twse.com.tw/v1/opendata/t187ap05_L|
          twse_openapi_t187ap06_L_ci|GET|json||https://openapi.twse.com.tw/v1/opendata/t187ap06_L_ci|
          twse_openapi_holidaySchedule|GET|json||https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule|
          twse_openapi_STOCK_DAY_ALL|GET|json||https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL|
          tpex_dailyQuotes|GET|json||https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/11/09&id=&response=json|
          tpex_tradingStock_6488|GET|json||https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=6488&date=2026/11/01&id=&response=json|
          tpex_highlight|GET|json||https://www.tpex.org.tw/www/zh-tw/afterTrading/highlight?date=2026/11/09&response=json|
          tpex_exDailyQ_result|GET|json||https://www.tpex.org.tw/web/stock/exright/dailyquo/exDailyQ_result.php?l=zh-tw&d=115/11/01&ed=115/11/10&o=json|
          tpex_openapi_spendi_history|GET|json||https://www.tpex.org.tw/openapi/v1/tpex_spendi_history|
          tpex_openapi_close_quotes|GET|json||https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes|
          tpex_openapi_t187ap04_O|GET|json||https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap04_O|
          tpex_openapi_t187ap05_O|GET|json||https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O|
          mops_www_home|GET|html|公開資訊觀測站|https://mops.twse.com.tw/mops/|
          mops_www_ajax_t05st01_2330|POST|html|公司代號|https://mops.twse.com.tw/mops/web/ajax_t05st01|encodeURIComponent=1&step=1&firstin=1&off=1&TYPEK=sii&co_id=2330&year=115&month=11&b_date=&e_date=
          mopsov_ajax_t05st01_2330|POST|html|公司代號|https://mopsov.twse.com.tw/mops/web/ajax_t05st01|encodeURIComponent=1&step=1&firstin=1&off=1&TYPEK=sii&co_id=2330&year=115&month=11&b_date=&e_date=
          mopsov_ajax_t05st10_ifrs_2330|POST|html|公司代號|https://mopsov.twse.com.tw/mops/web/ajax_t05st10_ifrs|encodeURIComponent=1&step=1&firstin=1&off=1&TYPEK=sii&co_id=2330&year=114&month=09
          mopsov_ajax_t163sb20_sii_114Q4|POST|html|營業活動|https://mopsov.twse.com.tw/mops/web/ajax_t163sb20|encodeURIComponent=1&step=1&firstin=1&off=1&TYPEK=sii&year=114&season=04
          mopsov_nas_revenue_sii_115_9|GET|html|公司代號|https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_115_9.html|
          mopsov_nas_revenue_otc_115_9|GET|html|公司代號|https://mopsov.twse.com.tw/nas/t21/otc/t21sc03_115_9.html|
          finmind_TaiwanStockPrice_2330|GET|json||https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=2330&start_date=2026-11-02&end_date=2026-11-09|
          finmind_TaiwanStockInfo|GET|json||https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo|
          finmind_usage_no_token|GET|json||https://api.web.finmindtrade.com/v2/user_info|
          SPEC
          # 去除 heredoc 在 YAML 內的縮排
          sed -i 's/^ *//' endpoints.txt

          UA='Mozilla/5.0 (compatible; TwStockResearch/1.0; +actions connectivity probe)'
          : > out/raw_results.tsv
          while IFS='|' read -r name method kind kw url data; do
            [ -z "$name" ] && continue
            if [ "$method" = "POST" ]; then
              res=$(curl -sS -L --max-redirs 5 --max-time 60 -A "$UA" -c cj.txt -b cj.txt \
                    -e "https://mopsov.twse.com.tw/mops/web/t05st01" \
                    -X POST --data "$data" -o "body/$name" \
                    -w '%{http_code}\t%{time_total}\t%{size_download}\t%{num_redirects}\t%{content_type}' "$url" 2>"body/$name.err") && rc=0 || rc=$?
            else
              res=$(curl -sS -L --max-redirs 5 --max-time 60 -A "$UA" -c cj.txt -b cj.txt \
                    -o "body/$name" \
                    -w '%{http_code}\t%{time_total}\t%{size_download}\t%{num_redirects}\t%{content_type}' "$url" 2>"body/$name.err") && rc=0 || rc=$?
            fi
            [ -z "$res" ] && res=$'000\t0\t0\t0\t-'
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$kind" "$kw" "$rc" "$res" "$url" >> out/raw_results.tsv
            sleep 2
          done < endpoints.txt

          python3 - <<'PY'
          import json, os, re, datetime
          rows = []
          for line in open('out/raw_results.tsv', encoding='utf-8'):
              f = line.rstrip('\n').split('\t')
              name, kind, kw, rc, http, t, size, redir, ctype, url = f[:10]
              p = os.path.join('body', name)
              b = open(p, 'rb').read() if os.path.exists(p) else b''
              err = ''
              ep = p + '.err'
              if os.path.exists(ep):
                  err = open(ep, errors='replace').read().strip().replace('\n', ' ')[:120]
              valid_json = 'n/a'
              content_ok = 'no'
              note = ''
              text = ''
              for enc in ('utf-8', 'cp950'):
                  try:
                      text = b.decode(enc); break
                  except Exception:
                      text = b.decode('utf-8', errors='replace')
              if kind == 'json':
                  try:
                      j = json.loads(text); valid_json = 'yes'
                      ok = True
                      if isinstance(j, dict):
                          if 'stat' in j and str(j['stat']).upper() != 'OK': ok = False; note = 'stat=' + str(j['stat'])[:40]
                          if 'status' in j and j['status'] != 200: ok = False; note = 'status=%s %s' % (j['status'], str(j.get('msg', ''))[:50])
                          if 'tables' in j and not any(t_.get('data') for t_ in j['tables']): ok = False; note = 'tables empty'
                          if 'data' in j and isinstance(j['data'], list) and not j['data'] and 'stat' not in j: ok = False; note = 'data empty'
                      elif isinstance(j, list):
                          if not j: ok = False; note = 'empty list'
                      content_ok = 'yes' if ok else 'no'
                  except Exception:
                      valid_json = 'no'; note = 'not json'
              else:
                  blocked = any(w in text for w in ('安全性考量', 'FOR SECURITY REASONS', 'Request Rejected', 'Access Denied', 'THE PAGE CANNOT BE ACCESSED'))
                  if blocked: note = 'block page'
                  elif kw and kw not in text: note = 'keyword "%s" missing' % kw
                  elif not b: note = 'empty'
                  else: content_ok = 'yes'
              if rc != '0': note = ('curl_rc=%s %s %s' % (rc, err, note)).strip()
              if http != '200' and not note: note = 'http ' + http
              head = re.sub(r'[\x00-\x1f\x7f]+', ' ', b[:200].decode('utf-8', errors='replace'))
              rows.append(dict(name=name, http=http, time_s=float(t), bytes=int(size), redirects=int(redir),
                               content_type=ctype, kind=kind, valid_json=valid_json, content_ok=content_ok,
                               note=note, url=url, head200=head))
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          hdr = '%-34s %-5s %-8s %-9s %-5s %-10s %-10s %s' % ('endpoint', 'http', 'time_s', 'bytes', 'redir', 'valid_json', 'content_ok', 'note')
          lines = ['# actions-probe  finished_utc=%s  runner=%s' % (now, os.environ.get('RUNNER_OS', '?')), hdr, '-' * 110]
          for r in rows:
              lines.append('%-34s %-5s %-8.2f %-9d %-5d %-10s %-10s %s' % (r['name'], r['http'], r['time_s'], r['bytes'], r['redirects'], r['valid_json'], r['content_ok'], r['note']))
          ok_n = sum(r['content_ok'] == 'yes' for r in rows)
          lines.append('-' * 110)
          lines.append('content_ok=yes: %d / %d' % (ok_n, len(rows)))
          open('out/probe_table.txt', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          json.dump(dict(finished_utc=now, rows=rows), open('out/probe.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('\n'.join(lines))
          PY

      - name: 上傳結果 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-probe-result
          path: out/
          retention-days: 14
